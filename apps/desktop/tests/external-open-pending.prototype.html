<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部打开 · 独立交互原型</title>
<style>
:root{color-scheme:light dark;font:14px/1.55 system-ui,sans-serif;color:CanvasText;background:Canvas}*{box-sizing:border-box}body{margin:0;padding:12px;max-width:1000px}h1{font-size:17px;margin:0 0 8px}p{margin:4px 0}.scope{border:1px dashed GrayText;padding:8px;margin-bottom:12px;color:GrayText}.surface{display:flex;flex-direction:column;border:1px solid GrayText;border-radius:8px;min-width:0}.header{padding:10px;border-bottom:1px solid GrayText}.pending{flex:none;padding:10px;border-bottom:1px solid GrayText;overflow-wrap:anywhere}.pending[hidden]{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.path{font-weight:600;min-width:0;flex:1 1 240px;overflow-wrap:anywhere}.reason{color:GrayText;margin:5px 0;white-space:pre-wrap}.actions{display:flex;gap:6px;flex-wrap:wrap}button,select{font:inherit;padding:6px 10px;min-height:34px;max-width:100%;white-space:normal;overflow-wrap:anywhere}button:focus-visible,textarea:focus-visible{outline:2px solid Highlight;outline-offset:2px}.editor{padding:12px;min-width:0}textarea{width:100%;min-height:160px;resize:vertical;font:14px/1.6 monospace}label{display:block;margin:8px 0}.controls{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls label{margin:0}#log{font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.note{font-size:12px;color:GrayText}#displayed{padding:10px;border:1px solid GrayText;overflow-wrap:anywhere}@media(max-width:480px){body{padding:8px}.path{flex-basis:100%}.actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.actions button{width:100%}.pending{padding:8px}.header{padding:8px}}
</style></head><body>
<h1>外部打开：非模态待打开条</h1><div class="scope">隔离原型 · 不连接 Nozeli/Host/Provider。不代表生产入口已接线。以下路径、源内容与队列均为合成样例。</div>
<section class="surface"><header class="header">阅读工作面 · 当前：<strong id="subject">原项目 / 当前草稿.md</strong></header>
<section class="pending" aria-label="外部待打开请求"><div class="row"><span id="pending-count">还有 2 项待打开</span><span class="path" id="pending-path">资料项目 / 包含空格的材料与长名字 / notes/外部参考文献.md</span></div><p class="reason" id="pending-reason" role="status" aria-live="polite">等待显式打开。失败、输入法结束或通知不会自动重试。</p><div class="actions"><button id="open">打开这一项</button><button id="remove">移除这项请求</button><button id="receipt" hidden>确认已打开并保存回执</button><button id="next" hidden>打开下一项（显式）</button></div></section>
<div class="editor"><label for="draft">当前未保存草稿（待打开条不遮挡或抢焦点）</label><textarea id="draft">USER_DRAFT：此处可继续编辑，任何新输入都会撤销进行中的外部切换。</textarea><div id="displayed" hidden></div><p class="note">下方保留原草稿供原型检查；正式产品依既有项目/文件/备注持久记录保存，不另建副本编辑器。</p></div></section>
<div class="controls"><label>故障驱动 <select id="fault"><option value="none">无故障</option><option value="COMPOSING">IME 仍在组合</option><option value="CONFLICT">CAS 保存冲突</option><option value="VIEW_UNREADABLE">视图不可写</option><option value="MOUNT_FAILED">预览挂载失败</option><option value="ACK_UNCONFIRMED">显示后回执失败</option></select></label><button id="notice">模拟一次通知（不打开）</button></div><pre id="log" aria-label="独立原型事件原件"></pre>
<script type="module">
import {createExternalOpenPrototype,strictActionLane} from './external-open-renderer.prototype.mjs';
const $=id=>document.getElementById(id),events=[],target={projectId:'synthetic-project',relPath:'notes/外部参考文献.md'},claim={synthetic:true};let surfaceEpoch=1,ackCount=0,mountCount=0,remaining=2;
const ok=()=>({ok:true}),mode=()=>$('fault').value,fail=code=>({ok:false,error:{code,message:'合成故障：'+code+'；原工作与请求保持。'}}),delay=()=>new Promise(r=>setTimeout(r,150));
const record=event=>{events.push(event);$('log').textContent=JSON.stringify({production:false,mountCount,ackCount,events},null,2);window.prototypeEvidence={production:false,mountCount,ackCount,events:[...events]};};
const c=createExternalOpenPrototype({schedule:strictActionLane(),unsafe:()=>mode()==='COMPOSING'?{code:'COMPOSING',message:'输入法组合未结束；请结束后显式重试。'}:null,currentSurfaceEpoch:()=>surfaceEpoch,
 persistNote:async()=>{record('persist note');return ok();},persistTexPosition:async()=>ok(),flushSource:async()=>{record('save without overwrite');await delay();return mode()==='CONFLICT'?fail('CONFLICT'):ok();},writeLeavingView:async()=>mode()==='VIEW_UNREADABLE'?fail('VIEW_UNREADABLE'):ok(),
 activateNow:async(address,{guard})=>{await delay();guard();record('activate synthetic project, no restore-current');return ok();},readClaim:async()=>({ok:true,value:{identity:target,source:{kind:'text',diskPresent:true,digest:'synthetic-version',text:'合成外部材料；不是用户文件。'},readProof:claim}}),
 displayNow:async(loaded,{guard})=>{await delay();guard();if(mode()==='MOUNT_FAILED')return fail('MOUNT_FAILED');mountCount++;surfaceEpoch++;$('subject').textContent='合成项目 / '+target.relPath;$('displayed').hidden=false;$('displayed').textContent=loaded.source.text;record('synthetic material displayed');return {ok:true,value:{...target,healthy:true,sourceDigest:loaded.source.digest,surfaceEpoch,mode:'source'}};},writeTargetView:async()=>ok(),confirmVisible:async()=>{await new Promise(requestAnimationFrame);record('isolated DOM visible');return ok();},
 acknowledgeDisplayed:async()=>{ackCount++;record('synthetic receipt attempt only');return mode()==='ACK_UNCONFIRMED'?{confirmed:false,error:{code:'ACK_UNCONFIRMED',message:'材料已显示，尚未确认持久回执；仅补回执，不再次打开。'}}:{confirmed:true};},defer:async()=>{record('synthetic deferred retained');return {retained:true};}
});
function show(result){if(result.outcome==='deferred'){$('pending-reason').textContent=result.error.message;$('open').textContent='重试这一项';}else if(result.receipt==='pending'){$('pending-reason').textContent=result.error.message;$('open').hidden=true;$('remove').hidden=true;$('receipt').hidden=false;}else{remaining=Math.max(0,remaining-1);$('pending-count').textContent='还有 '+remaining+' 项待打开';$('pending-reason').textContent='合成回执已确认；下一项不会自动打开。';$('open').hidden=true;$('remove').hidden=true;$('receipt').hidden=true;$('next').hidden=!remaining;}window.prototypeLast=result;}
$('open').onclick=async()=>{$('open').disabled=true;try{show(await c.attempt(claim,target));}finally{$('open').disabled=false;}};
$('receipt').onclick=async()=>{$('receipt').disabled=true;try{show(await c.retryReceipt());}finally{$('receipt').disabled=false;}};
$('next').onclick=()=>{$('next').hidden=true;$('open').hidden=false;$('remove').hidden=false;$('open').textContent='打开这一项';$('pending-reason').textContent='已选择下一项，尚未打开；请显式打开。';};
$('remove').onclick=()=>{if(confirm('仅从合成队列移除这一请求，不删除源文件或草稿。继续？')){remaining--;record('synthetic request removed, no file deletion');$('pending-count').textContent='还有 '+remaining+' 项待打开';$('pending-reason').textContent='只移除合成请求；原草稿保留。';}};
$('draft').addEventListener('input',()=>{c.interaction();record('user input epoch changed');});$('draft').addEventListener('compositionstart',()=>c.interaction());$('fault').onchange=()=>c.interaction();$('notice').onclick=()=>{c.notice();record('notice only, no open/retry');};record('prototype ready');
</script></body></html>
