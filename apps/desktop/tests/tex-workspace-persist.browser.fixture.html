<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实 TeX workspace 模块保存 smoke</title><style>body{font:14px/1.6 system-ui;max-width:760px;margin:16px}button,select{font:inherit;padding:6px;margin:4px}#tex-toolbar{border:1px solid #999;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.scope{color:#666}textarea{width:100%;height:80px}</style></head><body><h1>生产 TeX workspace 模块 · DOM/IPC smoke</h1><p class="scope">独立页面，不是 Nozeli 产品窗口。实际导入生产模块；Host IPC 为明确 fixture，不启动编译或模型。</p><div id="reader-scroll"></div><div id="secondary-scroll"></div><section id="secondary-pane"><span class="compare-switch"></span></section><div id="documents"></div><div id="pane-divider"></div><div id="secondary-text"></div><div id="secondary-pdf"></div><div id="secondary-tools"></div><div id="secondary-message"></div><span id="secondary-path"></span><textarea id="source">USER_UNSAVED_TEX_SOURCE</textarea><button id="checked">严格保存位置</button><button id="business">下一次业务拒绝</button><button id="transport">下一次运输异常</button><pre id="result"></pre><script type="module">
import {mountTexWorkspace} from './tex-workspace.mjs';
const context={project:{id:'smoke-project'},file:{kind:'text',relPath:'paper.tex'}},calls=[],config={root:'paper.tex',engine:'xelatex',automatic:false};let fault=null;
window.nozeli={subscribe(){return ()=>{};},invoke:async(op,args)=>{calls.push({op,args});if(op==='tex.inspect')return {ok:true,value:{config,configuredRoot:'paper.tex',texFiles:['paper.tex'],tools:{xelatex:true},view:{page:3,zoom:1.25,scrollTop:99,preview:false,linked:true},syncTool:false,state:{projectId:'smoke-project',phase:'idle',message:'CURRENT_SMOKE_PAGE'}}};if(op==='tex.view'){if(fault==='business'){fault=null;return {ok:false,error:{code:'SMOKE_HOST_REFUSED',message:'Synthetic Host refused this position'}};}if(fault==='transport'){fault=null;throw Error('Synthetic IPC transport exception');}return {ok:true,value:{savedView:args.view}};}throw Error('Unexpected smoke operation '+op);}};
const beside={tex:false,pdf:null},workspace=mountTexWorkspace({getContext:()=>context,beside,closeBeside:()=>{beside.tex=false;beside.pdf=null;},openFile:async()=>{throw Error('Smoke must not navigate');}});
window.texPersistSmoke={workspace,calls,context,beside,get fault(){return fault;},set fault(value){fault=value;}};
document.getElementById('checked').onclick=async()=>{const result=await workspace.persistChecked();document.getElementById('result').textContent=JSON.stringify({result,status:document.getElementById('tex-status').textContent,source:document.getElementById('source').value,calls},null,2);window.lastCheckedResult=result;};document.getElementById('business').onclick=()=>{fault='business';};document.getElementById('transport').onclick=()=>{fault='transport';};await workspace.enter();window.texPersistSmokeReady=true;
</script></body></html>
