<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <title>演示控制</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./guided-demo-controls.css">
</head>
<body>
  <section id="guided-demo-player" aria-label="演示播放控制" hidden>
    <header id="demo-drag" tabindex="0" aria-label="移动演示控制区，方向键可移动" title="拖动控制区；方向键移动">
      <span class="demo-grip" aria-hidden="true">⋮⋮</span>
      <span data-demo-badge title="本地固定回复，不调用模型">离线演示</span>
      <strong id="demo-title"></strong><span id="demo-progress"></span>
    </header>
    <div class="demo-primary" id="demo-primary"></div>
    <input type="range" id="demo-seek" aria-label="演示进度，可拖动跳到某一步" min="0" max="1" step="1" value="0">
    <p id="demo-error" role="alert" hidden></p>
  </section>
  <script type="module" src="./guided-demo-controls.js"></script>
</body>
</html>
