name: Native updater qualification

on:
  push:
    branches: ['integration/update-native-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-updater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-update:
    name: macOS arm64 actual update and rollback
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.23.4'
      - name: Require actual native platform
        run: test "$(uname -m)" = arm64 && test "$(uname -s)" = Darwin
      - name: Install locked desktop and Pi dependencies
        run: npm ci --no-audit --no-fund && npm ci --prefix ../../integrations/pi --no-audit --no-fund
      - name: Build actual private runtime and renderer
        run: npm run build:pptist && npm run build:pi && npm run build:renderer
      - name: Build native filesystem and process helpers
        run: node tools/build-macos-native.mjs
      - name: Build standalone application with bundled updater helper
        run: node tools/package-macos.mjs "$RUNNER_TEMP/nozeli-update-app"
      - name: Exercise native update and failure rollback
        run: |
          mkdir -p .test-output/ci
          TMPDIR="$PWD/.test-output/ci" NOZELI_MAC_UPDATE_APP="$RUNNER_TEMP/nozeli-update-app/Nozeli.app" node --test tests/auto-update-macos-native.test.mjs 2>&1 | tee .test-output/ci/macos-native-update.tap
        shell: bash -eo pipefail {0}
      - name: Retain isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-updater-evidence-${{ github.sha }}
          path: |
            apps/desktop/.test-output/ci/macos-native-update.tap
            apps/desktop/.test-output/ci/*update*/*.json
            apps/desktop/.test-output/ci/*update*/*.png
            apps/desktop/.test-output/macos-update-*/report.json
            apps/desktop/.test-output/macos-update-*/main.log
            apps/desktop/.test-output/macos-update-*/*.png
          if-no-files-found: warn
          retention-days: 7
