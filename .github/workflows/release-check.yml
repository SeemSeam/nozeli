name: Release candidate check

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate (never a branch or arbitrary shell input)
        required: true
        type: string
        default: v0.1.0-alpha.1

permissions:
  contents: read

concurrency:
  group: release-candidate-check
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Require tag to match package version
        env:
          TAG: ${{ inputs.tag }}
        run: node -e 'const p=require("./apps/desktop/package.json");if(process.env.TAG!=="v"+p.version)throw Error("Tag/version mismatch")'
      - name: Install desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Install and test
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund && npm test
      - name: Configure Electron sandbox on this ephemeral runner
        working-directory: apps/desktop
        run: |
          node -e 'require("electron")'
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build pinned application inputs
        working-directory: apps/desktop
        run: npm run build:pptist && npm run build:omp && npm run build:renderer
      - name: Check repository and exercise Electron
        working-directory: apps/desktop
        run: node ../../tools/check-repository.mjs && xvfb-run -a npm run test:smoke
        env:
          NOZELI_OZONE: x11
      - name: Generate locked npm production dependency inventory
        working-directory: apps/desktop
        run: mkdir -p .test-output/ci && npm sbom --package-lock-only --sbom-format cyclonedx --omit dev > .test-output/ci/sbom.cdx.json
      - name: Enforce public redistribution prerequisites
        run: node tools/check-repository.mjs --public
      # No public upload step: publishing remains an explicit maintainer action
      # after code, runtime and distribution prerequisites have been reviewed.
      - name: Preserve validation evidence (not an end-user binary)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-validation-evidence
          path: |
            apps/desktop/.test-output/ci/*.tap
            apps/desktop/.test-output/ci/*.json
            apps/desktop/.test-output/ci/*.log
            apps/desktop/.test-output/ci/smoke-*/*.png
            apps/desktop/.test-output/ci/smoke-*/report.json
            apps/desktop/.test-output/ci/smoke-*/main.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
