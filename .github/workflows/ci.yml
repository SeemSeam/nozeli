name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Prepare isolation regression on ephemeral runner
        if: matrix.suite == 'integration'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Pi SDK test dependencies
        run: npm ci --prefix ../../integrations/pi --no-audit --no-fund
      - name: Run deterministic tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: 'true'
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.suite }}-reports
          path: apps/desktop/.test-output/ci/*.tap
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  build-smoke:
    name: Linux clean build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure Electron sandbox on this ephemeral runner
        run: |
          node -e 'require("electron")'
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build pinned Office engine
        run: npm run build:pptist
      - name: Build private Pi from pinned source
        run: npm run build:pi
      - name: Build renderer
        run: npm run build:renderer
      - name: Validate repository metadata
        run: node ../../tools/check-repository.mjs
      - name: Exercise actual desktop without model calls
        run: xvfb-run -a npm run test:smoke
        env:
          CI: 'true'
          NOZELI_OZONE: x11
      - name: Generate locked npm production dependency inventory
        run: mkdir -p .test-output/ci && npm sbom --package-lock-only --sbom-format cyclonedx --omit dev > .test-output/ci/sbom.cdx.json
      - name: Preserve build and smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-smoke-evidence
          path: |
            apps/desktop/.test-output/ci/*.json
            apps/desktop/.test-output/ci/*.log
            apps/desktop/.test-output/ci/smoke-*/*.png
            apps/desktop/.test-output/ci/smoke-*/report.json
            apps/desktop/.test-output/ci/smoke-*/main.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [tests, build-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build-smoke.result }}
        run: test "$TESTS" = success && test "$BUILD" = success
