name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run deterministic tests
        run: npm run test:${{ matrix.suite }}
        env:
          CI: 'true'
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.suite }}-reports
          path: apps/desktop/.test-output/ci/
          if-no-files-found: warn
          retention-days: 7

  build-smoke:
    name: Linux clean build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build pinned Office engine
        run: npm run build:pptist
      - name: Build private OMP from pinned source
        run: npm run build:omp
      - name: Build renderer
        run: npm run build:renderer
      - name: Validate repository metadata
        run: node ../../tools/check-repository.mjs
      - name: Exercise actual desktop without model calls
        run: xvfb-run -a npm run test:smoke
        env:
          CI: 'true'
          NOZELI_OZONE: x11
      - name: Generate dependency inventory
        run: mkdir -p .test-output/ci && npm sbom --sbom-format cyclonedx --omit dev > .test-output/ci/sbom.cdx.json
      - name: Preserve build and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-build-smoke-evidence
          path: |
            apps/desktop/.test-output/ci/
            apps/desktop/.test-output/smoke-*/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [tests, build-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build-smoke.result }}
        run: test "$TESTS" = success && test "$BUILD" = success
