name: macOS arm64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS 26 arm64 build and local verification
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Record actual host
        run: |
          sw_vers
          uname -m
          node -e 'if(process.platform!=="darwin"||process.arch!=="arm64")throw Error("Unexpected host");console.log(process.versions)'
          xcode-select -p
      - name: Install locked dependencies and build native bridge
        run: npm ci --no-audit --no-fund
      - name: Build pinned engines and renderer
        run: |
          npm run build:pptist
          npm run build:omp
          npm run build:renderer
      - name: Validate metadata and deterministic suites
        env:
          NOZELI_TEST_CONCURRENCY: '1'
        run: |
          node ../../tools/check-repository.mjs
          npm run test:unit
          npm run test:integration
          node tools/test-macos-volumes.mjs
      - name: Scripted native runtime with loopback only
        env:
          NOZELI_TEST_LIVE: '1'
          NOZELI_TEST_CONCURRENCY: '1'
        run: npm run test:live
      - name: Actual desktop smoke
        run: npm run test:smoke
      - name: Assemble signed local application and disk image
        run: node tools/package-portable.mjs "$RUNNER_TEMP/nozeli-package"
      - name: Extract disk image and exercise every required file format
        run: node tools/test-macos-package.mjs "$RUNNER_TEMP/nozeli-package" "$RUNNER_TEMP/nozeli-acceptance"
      - name: Verify runtime and OS file events from the extracted application
        env:
          NOZELI_TEST_BUNDLE: ${{ runner.temp }}/nozeli-acceptance/独立验证 app/Nozeli.app
          TMPDIR: /private/tmp
        run: |
          node --test --test-concurrency=1 tests/agent-resource-native.test.mjs tests/managed-local-disposition.test.mjs
          node tests/macos-open-file.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-arm64-evidence
          path: |
            apps/desktop/.test-output/ci/*.tap
            apps/desktop/.test-output/ci/*.json
            apps/desktop/.test-output/ci/*/report.json
            apps/desktop/.test-output/ci/*/main.log
            apps/desktop/.test-output/ci/*/launch-services.log
            apps/desktop/.test-output/ci/*/*.png
            ${{ runner.temp }}/nozeli-package/SHA256SUMS.txt
            ${{ runner.temp }}/nozeli-package/SOURCE-SNAPSHOT.json
            ${{ runner.temp }}/nozeli-acceptance/*.json
            ${{ runner.temp }}/nozeli-acceptance/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
