name: Windows release draft build

# Private-to-workflow candidate artifacts; this job never publishes a release.
on:
  push:
    branches: ['release/beta*-**']
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-hex source commit SHA to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release-draft-${{ inputs.ref || github.sha }}
  cancel-in-progress: false
jobs:
  package:
    name: Windows x64 draft packaging and archive smoke
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Bind exact native host and source SHA
        env:
          EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          node -e 'if(!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_COMMIT)||process.platform!=="win32"||process.arch!=="x64")throw Error("Exact SHA and native Windows x64 required")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse HEAD) -cne $env:EXPECTED_COMMIT) { throw 'Checkout SHA differs' }
      - name: Install locked desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Pi dependencies
        run: npm ci --prefix ../../integrations/pi --no-audit --no-fund
      - name: Build pinned Office engine
        run: npm run build:pptist
      - name: Prepare private Pi runtime
        run: npm run build:pi
      - name: Package fresh draft and smoke extracted native runtimes
        run: node tools/package-windows-release.mjs "$env:RUNNER_TEMP/nozeli-windows-release" --manual
      - name: Record draft-only boundary
        run: |
          'Unsigned manual Windows candidate; see WINDOWS-SMOKE.json for the limited extracted-runtime checks.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ inputs.ref || github.sha }}
          path: ${{ runner.temp }}/nozeli-windows-release/
          if-no-files-found: error
          retention-days: 7
