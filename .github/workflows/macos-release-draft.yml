name: macOS release draft build

# Draft-only macOS arm64 packaging evidence for a prerelease: builds the real
# bundle from one exact commit on a macos-15 arm64 runner, self-checks the
# extracted archive, then keeps everything as short-lived Actions artifacts.
# It never creates or uploads a public GitHub release; publication stays an
# explicit maintainer action (dev_tools/skills/nozeli-github/SKILL.md).
#
# Push trigger on release/beta*-** builds each Beta candidate without a merge.
# release branch (workflow_dispatch registration needs no default-branch
# merge first); the dispatch input pins one exact 40-hex commit SHA.

on:
  push:
    branches: ['release/beta*-**']
  workflow_dispatch:
    inputs:
      ref:
        description: Exact release commit SHA (40 hex) to package; must be the tagged release commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-draft-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  package:
    name: macOS arm64 draft packaging and archive smoke
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate the exact-commit input
        env:
          EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          node -e 'const sha=process.env.EXPECTED_COMMIT;if(!/^[0-9a-f]{40}$/.test(sha))throw Error("expected one exact 40-hex commit SHA, got: "+sha)'
      - name: Require a darwin arm64 runner (never a hidden x64 build)
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers -productVersion
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})'
      - name: Verify the checkout is exactly the intended commit
        env:
          EXPECTED_COMMIT: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Pi SDK dependencies
        run: npm ci --prefix ../../integrations/pi --no-audit --no-fund
      - name: Build pinned Office engine
        run: npm run build:pptist
      - name: Build private Pi runtime from pinned source
        run: npm run build:pi
      - name: Package, checksum and self-check the release bundle
        run: node tools/package-macos-release.mjs "$RUNNER_TEMP/nozeli-macos-release"
      - name: Exercise report correction and recovery on the native host
        run: |
          mkdir -p "$RUNNER_TEMP/nozeli-recovery-home"
          HOME="$RUNNER_TEMP/nozeli-recovery-home" GIT_CONFIG_GLOBAL="$RUNNER_TEMP/nozeli-recovery-home/.gitconfig" GIT_CONFIG_NOSYSTEM=1 node --test tests/archify-diagram.test.mjs tests/diagram-controller-correction.test.mjs tests/diagram-recovery.test.mjs tests/report-recovery.test.mjs tests/managed-debug-protocol.test.mjs tests/managed-review-discussion.test.mjs
      - name: Smoke the packaged app from the extracted archive
        run: |
          OUT="$RUNNER_TEMP/nozeli-macos-release"
          ZIP="$(find "$OUT" -maxdepth 1 -name 'Nozeli-*-macos-arm64.zip')"
          test -n "$ZIP"
          test "$(printf '%s\n' "$ZIP" | wc -l)" -eq 1
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/nozeli-archive-smoke-XXXX")"
          /usr/bin/ditto -x -k --sequesterRsrc "$ZIP" "$SMOKE_ROOT"
          NOZELI_TEST_BINARY="$SMOKE_ROOT/Nozeli.app/Contents/MacOS/Nozeli" node tests/desktop-ci-smoke.mjs
          TMPDIR="$PWD/.test-output/ci" NOZELI_TEST_BINARY="$SMOKE_ROOT/Nozeli.app/Contents/MacOS/Nozeli" node tests/desktop-task-workspace-live.mjs
          TMPDIR="$PWD/.test-output/ci" NOZELI_SHEET_LAYOUT_DIAGNOSTIC=1 NOZELI_TEST_BINARY="$SMOKE_ROOT/Nozeli.app/Contents/MacOS/Nozeli" node tests/desktop-office-journey-live.mjs
          TMPDIR="$PWD/.test-output/ci" NOZELI_TEST_BINARY="$SMOKE_ROOT/Nozeli.app/Contents/MacOS/Nozeli" node tests/desktop-platform-chrome-live.mjs
          TMPDIR="$PWD/.test-output/ci" NOZELI_TEST_BINARY="$SMOKE_ROOT/Nozeli.app/Contents/MacOS/Nozeli" node tests/desktop-timeline-order-live.mjs
      - name: Keep draft artifacts as Actions artifacts (never a public release upload)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-draft-${{ inputs.ref || github.sha }}
          path: |
            ${{ runner.temp }}/nozeli-macos-release/*.zip
            ${{ runner.temp }}/nozeli-macos-release/*.tar.gz
            ${{ runner.temp }}/nozeli-macos-release/*.md
            ${{ runner.temp }}/nozeli-macos-release/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve packaging and smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-smoke-evidence-${{ inputs.ref || github.sha }}
          path: |
            apps/desktop/.test-output/ci/*.log
            apps/desktop/.test-output/ci/*.json
            apps/desktop/.test-output/ci/smoke-*/*.png
            apps/desktop/.test-output/ci/smoke-*/report.json
            apps/desktop/.test-output/ci/smoke-*/main.log
            apps/desktop/.test-output/ci/nozeli-task-workspace-*/report.json
            apps/desktop/.test-output/ci/nozeli-task-workspace-*/electron.log
            apps/desktop/.test-output/ci/nozeli-task-workspace-*/*.png
            apps/desktop/.test-output/ci/nozeli-office-journey-*/report.json
            apps/desktop/.test-output/ci/nozeli-office-journey-*/electron-session-logs.json
            apps/desktop/.test-output/ci/nozeli-office-journey-*/*.png
            apps/desktop/.test-output/ci/nozeli-platform-chrome-*/report.json
            apps/desktop/.test-output/ci/nozeli-platform-chrome-*/electron.log
            apps/desktop/.test-output/ci/nozeli-platform-chrome-*/*.png
            apps/desktop/.test-output/ci/nozeli-timeline-order-*/report.json
            apps/desktop/.test-output/ci/nozeli-timeline-order-*/electron.log
            apps/desktop/.test-output/ci/nozeli-timeline-order-*/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
