<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nozeli · 图解初始页预览</title>
<style>
:root{color-scheme:dark;--canvas:#19232d;--paper:#222e3a;--surface:#293847;--ink:#e4ebf1;--muted:#a9b7c4;--line:#3b4a58;--accent:#aaccee;--on-accent:#172b3c;--idea:#879bad;font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}html[data-theme=light]{color-scheme:light;--canvas:#edf0f2;--paper:#fafbf9;--surface:#f0f4f1;--ink:#27332f;--muted:#626f69;--line:#d6ded9;--accent:#456856;--on-accent:#fff;--idea:#71877b}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink)}button,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;background:transparent;padding:6px 12px;min-height:36px}button{cursor:pointer}button:hover{background:var(--surface)}:is(button,select):focus-visible{outline:2px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}.review-tools,.feedback{max-width:1160px;margin:auto;padding:18px 24px}.review-tools h1{margin:0;font-size:15px;font-weight:600}.review-tools small,.feedback{color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px}.controls label{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}#theme{margin-left:auto}.stage{padding:0 20px}.window{width:100%;max-width:1120px;margin:auto;border:1px solid var(--line);border-radius:9px;background:var(--paper);container-type:inline-size;overflow:hidden}.window-bar{height:34px;border-bottom:1px solid var(--line);padding:6px 14px;font-size:12px;color:var(--muted)}.content{min-height:650px;padding:44px 48px;display:flex;align-items:safe center;justify-content:center}.empty{width:100%;max-width:900px}.ideals{font-size:clamp(28px,4.2cqi,44px);font-weight:500;line-height:1.3;letter-spacing:.12em;color:var(--idea);margin:0 0 24px}.ideals span{padding-inline:10px;color:var(--line);font-weight:300;letter-spacing:0}.intro h2{margin:0;font-size:22px;line-height:1.5;font-weight:600}.description{margin:6px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}.primary:hover{background:var(--accent);filter:brightness(1.08)}.note{font-size:12px;color:var(--muted);margin:8px 0 0}.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;row-gap:26px;border-top:1px solid var(--line);margin-top:30px;padding-top:26px}.feature{display:grid;grid-template-columns:144px minmax(0,1fr);gap:18px;align-items:center;min-width:0}.feature svg{width:100%;height:auto;display:block;color:var(--muted)}.feature h3{font-size:14px;font-weight:600;line-height:1.5;margin:0 0 5px}.feature p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.feature svg .accent{stroke:var(--accent)}.feature svg .wash{fill:var(--surface)}.feature svg .mark{fill:var(--accent);opacity:.3}.feature svg text{fill:var(--muted);font:11px system-ui,sans-serif;stroke:none}.feature svg .caption{fill:var(--accent)}.feedback p{margin:0}.feedback output{display:block;min-height:20px;margin-top:5px;color:var(--ink)}.window[data-mode=summary] .content{min-height:570px;padding:36px}.window[data-mode=summary] .empty{max-width:720px}.window[data-mode=summary] .ideals{font-size:30px;margin-bottom:20px}.window[data-mode=summary] .features{column-gap:24px;row-gap:18px;margin-top:24px;padding-top:20px}.window[data-mode=summary] .feature{grid-template-columns:92px minmax(0,1fr);gap:12px}.window[data-mode=compact]{max-width:440px}.window[data-mode=compact] .content{height:400px;min-height:0;overflow:auto;padding:20px}.window[data-mode=compact] .ideals{font-size:24px;letter-spacing:.05em;margin-bottom:16px}.window[data-mode=compact] .intro h2{font-size:18px}.window[data-mode=compact] .features{grid-template-columns:1fr;gap:14px;margin-top:20px;padding-top:16px}.window[data-mode=compact] .feature{grid-template-columns:76px minmax(0,1fr);gap:12px}.stage[data-width=narrow] .window{max-width:360px}@container(max-width:700px){.content{padding:28px 24px}.features{column-gap:20px}.feature{grid-template-columns:1fr;gap:10px}.feature svg{max-width:160px}.ideals{font-size:32px;letter-spacing:.04em}.window[data-mode=summary] .feature{grid-template-columns:1fr}}@container(max-width:440px){.content,.window[data-mode=summary] .content{padding:24px 16px}.features,.window[data-mode=summary] .features{grid-template-columns:1fr;gap:20px}.feature,.window[data-mode=summary] .feature{grid-template-columns:100px minmax(0,1fr);gap:12px}.ideals{font-size:26px;letter-spacing:.02em}.ideals span{padding-inline:5px}.intro h2{font-size:19px}.feature p{font-size:12px}.window[data-mode=summary] .ideals{font-size:26px}}@media(max-width:500px){.review-tools,.feedback{padding:16px}.stage{padding:0 10px}.controls label{width:100%;justify-content:space-between}#theme{margin-left:0}}
.empty{max-width:760px}.ideals{font-size:36px;line-height:48px;margin-bottom:16px}.content{padding:32px}.feature{display:block}.feature svg{height:96px;width:100%;max-width:none}.feature h3{margin-top:10px}.window[data-mode=summary] .empty{max-width:640px}.window[data-mode=summary] .ideals{font-size:28px;line-height:38px}.window[data-mode=summary] .feature{display:block}.window[data-mode=summary] .feature svg{height:64px}.window[data-mode=compact]{max-width:320px}.window[data-mode=compact] .content{height:180px}.features-label{font-size:11px;color:var(--muted);margin:24px 0 -18px}.window[data-mode=compact] .feature{display:grid;grid-template-columns:88px minmax(0,1fr)}@container(max-width:480px){.features,.window[data-mode=summary] .features{grid-template-columns:1fr}.feature,.window[data-mode=summary] .feature{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px}.feature svg,.window[data-mode=summary] .feature svg{height:64px}.feature h3{margin-top:0}.ideals,.window[data-mode=summary] .ideals{font-size:24px;line-height:34px}.content,.window[data-mode=summary] .content{padding:24px 16px}}
.empty{max-width:920px}.window[data-mode=summary] .empty{max-width:760px}.feature-picture{display:block;width:100%;padding:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#222e3a;cursor:zoom-in}.feature-picture img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain}.feature h3{margin:12px 0 4px;font-size:15px}.feature p{font-size:13px}.features{gap:28px}.feature,.window[data-mode=summary] .feature,.window[data-mode=compact] .feature{display:block}.window[data-mode=compact] .features{gap:22px}.features-label{margin-bottom:0}.features{margin-top:10px;padding-top:20px}#image-viewer{width:min(1100px,calc(100vw - 32px));max-height:90dvh;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);overflow:auto}#image-viewer::backdrop{background:#000a}#image-viewer header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}#image-viewer img{display:block;width:100%;height:auto}#image-viewer header button{font-size:22px;line-height:1}@container(max-width:600px){.features,.window[data-mode=summary] .features{grid-template-columns:1fr}.feature,.window[data-mode=summary] .feature{display:block}.content,.window[data-mode=summary] .content{padding:24px 16px}}
#image-viewer[open]{display:flex;flex-direction:column;overflow:hidden;max-height:90dvh}#image-viewer header{flex:none}#image-viewer nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;flex:none}.image-scroll{overflow:auto;min-height:0;min-width:0}#image-viewer[data-size=original] img{width:1536px;max-width:none;height:auto}
.feature-picture,.image-scroll{background:var(--accent);isolation:isolate}.feature-picture img,.image-scroll img{filter:grayscale(1) invert(1);mix-blend-mode:luminosity}html[data-theme=dark] .feature-picture img,html[data-theme=dark] .image-scroll img{filter:grayscale(1)}
</style></head><body>
<header class="review-tools"><h1>设计预览 · 非产品界面 <small>／ 图解版</small></h1><nav class="controls" aria-label="预览控制"><label>状态<select id="state"><option value="welcome">未打开项目</option><option value="project">未打开文件</option><option value="emptyProject">项目目录为空</option><option value="compact">空分区</option><option value="detached">独立窗口</option></select></label><label>宽度<select id="width"><option value="wide">宽窗</option><option value="narrow">窄窗</option></select></label><button id="theme" type="button">切换浅色</button></nav></header>
<main class="stage" id="stage" data-width="wide"><section class="window" id="window" aria-label="产品界面设计预览"><header class="window-bar" id="window-title">Nozeli</header><div class="content"><section class="empty"><p class="ideals" aria-label="直观、专注、控制">直观<span>·</span>专注<span>·</span>控制</p><div class="intro"><h2 id="title"></h2><p class="description" id="description"></p><div class="actions" id="actions"></div></div><section class="features" id="features" aria-label="基本功能图解"></section></section></div></section></main>
<footer class="feedback"><output id="feedback" role="status" aria-live="polite"></output></footer>
<dialog id="image-viewer" aria-labelledby="image-title"><header><strong id="image-title"></strong><button type="button" aria-label="关闭图片预览" onclick="document.getElementById('image-viewer').close()">×</button></header><nav aria-label="图片缩放"><button type="button" onclick="document.getElementById('image-viewer').dataset.size='fit'">适应窗口</button><button type="button" onclick="document.getElementById('image-viewer').dataset.size='original'">原始尺寸</button></nav><div class="image-scroll" tabindex="0" aria-label="图片滚动区域"><img id="large-image" alt=""></div></dialog>
<script>
const $=id=>document.getElementById(id);
const images=["01-annotation-closeup.png","02-task-loop-closeup.png","03-split-reading-closeup.png","04-detached-window-closeup.png"];
const features=[['批注与选区讨论','原处批注与讨论，明确发送才交给 Agent。'],['任务闭环','后台交付报告与差异，由你接受或反馈修改。'],['分屏阅读','材料、对话与报告并排查看。'],['独立窗口','移到独立窗口或返回，编辑与会话保留。']];
const states={welcome:{title:'',description:'',mode:'full',bar:'Nozeli',actions:['打开本地项目','体验演示']},project:{title:'未打开文件',description:'从项目中选择文件，开始阅读或编辑。',mode:'summary',bar:'工作区',actions:['浏览项目文件']},emptyProject:{title:'项目目录暂无文件',description:'将材料放入项目文件夹后，从文件列表打开。',mode:'summary',bar:'工作区',actions:['浏览项目文件']},compact:{title:'此分区暂无内容',description:'选择项目文件，在此分区打开。',mode:'compact',bar:'空分区',actions:['浏览项目文件']},detached:{title:'此分区暂无内容',description:'从主窗口打开文件。',mode:'compact',bar:'独立窗口',actions:[]}};
function render(){const s=states[$('state').value];$('window').dataset.mode=s.mode;$('window-title').textContent=s.bar;$('title').textContent=s.title;$('title').hidden=!s.title;$('description').textContent=s.description;$('description').hidden=!s.description;$('actions').replaceChildren();for(const [i,label]of s.actions.entries()){const b=document.createElement('button');b.type='button';b.textContent=label;if(i===0)b.className='primary';b.onclick=()=>$('feedback').textContent='模拟：'+label+'。本预览未访问文件、未启动教学或模型。';$('actions').append(b);}$('actions').hidden=!s.actions.length;$('features').replaceChildren();features.forEach(([title,text],i)=>{const article=document.createElement('article');article.className='feature';const picture=document.createElement('button');picture.type='button';picture.className='feature-picture';picture.setAttribute('aria-label','放大'+title+'生成示意图');const img=document.createElement('img');img.src='assets/'+images[i];img.alt=title+'的AI生成功能示意图，非实测截图';img.width=1536;img.height=1024;picture.append(img);picture.onclick=()=>{ $('large-image').src=img.src;$('large-image').alt=img.alt;$('image-title').textContent=title;$('image-viewer').showModal();};const copy=document.createElement('div'),heading=document.createElement('h3'),p=document.createElement('p');heading.textContent=title;p.textContent=text;copy.append(heading,p);article.append(picture,copy);$('features').append(article);});$('feedback').textContent='';}
$('state').onchange=render;$('width').onchange=()=>$('stage').dataset.width=$('width').value;$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('theme').textContent=dark?'切换深色':'切换浅色';};const params=new URLSearchParams(location.search);if(states[params.get('state')])$('state').value=params.get('state');if(params.get('theme')==='light')$('theme').click();render();
</script></body></html>
