  const missing=i.id==='video-worker'&&!items.find(x=>x.id==='video').installed;
  const state=bindings.includes(i.id)?'已引入 · 项目固定版本 · '+(role?'0 个运行实例':'适用：'+(projectTargets[i.id]||[]).map(t=>roleNames[t]).join('、')):'未引入';
  return '<article class="list-row"><div><strong>'+escape(i.name)+'</strong> <span class="badge">v'+escape(i.version)+'</span><p>'+escape(i.description)+'</p><span class="small quiet">'+escape(state)+'</span>'+(missing?'<p class="warning">缺少视频引擎；不能执行该类任务</p>':'')+'</div><div><button data-detail="'+i.id+'">详情</button> <button data-bind="'+i.id+'">'+(bindings.includes(i.id)?'移除绑定':'引入项目')+'</button></div></article>';
 }).join('')+'<div class="toolbar"><button data-view="market">从市场安装更多资源</button></div></div>';
 document.querySelectorAll('[data-project-tab]').forEach(b=>b.onclick=()=>{projectTab=b.dataset.projectTab;render()});
}
function bindProject(id){
 const i=items.find(i=>i.id===id),arr=i.type==='role'?members:projectSkills;
 if(arr.includes(id)){arr.splice(arr.indexOf(id),1);delete projectTargets[id];render();toast('已移除模拟项目绑定；旧任务／成果不删除。');return}
 dialog('引入项目 · '+i.name,'<p>目标：视觉研究（合成项目）</p><p>资源版本：'+escape(i.version)+'，固定版本，不跟随全局静默更新。</p>'+(i.type==='skill'?'<fieldset><legend>在本项目适用的角色（至少一项）</legend>'+Object.entries(roleNames).map(([key,label])=>'<label><input type="checkbox" name="project-target" value="'+key+'" '+(i.targets?.includes(key)?'checked':'')+'> '+label+'</label>').join('')+'</fieldset>':'<p>包含角色说明、私有技能与公共技能依赖。引入不会启动Worker或自动派工。</p>')+(i.id==='video-worker'&&!items.find(x=>x.id==='video').installed?'<p class="warning">缺少视频引擎：可先登记成员，但不能执行该类任务；不会自动安装依赖。</p>':''),[['取消',close],['确认模拟引入',()=>{
  if(i.type==='skill'){const targets=[...document.querySelectorAll('[name=project-target]:checked')].map(n=>n.value);if(!targets.length){toast('请选择本项目适用的角色。');return}projectTargets[id]=targets}
  arr.push(id);close();render();toast('已固定引入版本与适用角色；未发起模型请求或任务。');
 },true]]);
}
function custom(base){
 dialog(base?'创建定制副本':'自定义资源','<p class="quiet">本地编辑示例，只保存在本页内存。原始包不被覆盖。</p><label for="custom-type">资源类型</label><select id="custom-type"><option value="engine">引擎适配声明</option><option value="skill">Skill</option><option value="role">Role Spec</option></select><label for="custom-name">名称</label><input id="custom-name" maxlength="70" value="'+escape(base?'我的 '+base.name:'')+'"><label for="custom-body">用途 / 定制说明</label><textarea id="custom-body" maxlength="4000">'+escape(base?.description||'')+'</textarea><div id="role-fields"><label for="role-spec">角色说明</label><textarea id="role-spec" maxlength="4000">'+escape(base?.spec||'完成专业分析，保留来源与不确定性；遵守当前Work边界。')+'</textarea><label for="private-skill">私有技能正文</label><textarea id="private-skill" maxlength="4000">'+escape(base?.privateSkill||'先核验材料，再检查证据与结论的一致性，输出可追溯报告。')+'</textarea><label for="public-skill">引用公共技能（固定版本）</label><select id="public-skill"><option value="">不引用</option>'+items.filter(i=>i.type==='skill'&&i.installed).map(i=>'<option value="'+i.id+'">'+escape(i.name)+'@'+escape(i.version)+'</option>').join('')+'</select></div><p class="small quiet">引擎只创建适配声明，不加载程序。技能脚本、角色权限和引擎二进制需在真实安装流程单独审查。</p>',[['取消',close],['创建模拟资源',()=>{
  const name=$('#custom-name').value.trim(),description=$('#custom-body').value.trim(),type=$('#custom-type').value;
  if(!name||!description){toast('请填写名称和说明。');return}
  const extra=type==='role'?{spec:$('#role-spec').value.trim(),privateSkill:$('#private-skill').value.trim(),publicSkill:$('#public-skill').value}:{};
  if(type==='role'&&(!extra.spec||!extra.privateSkill)){toast('请填写角色说明与私有技能。');return}
  items.push({id:'custom-'+Date.now(),type,name,description,by:'本地自定义 · 示例',version:'0.1.0',installed:true,custom:true,targets:[],download:'未提供',disk:'未提供',...extra});
  category=type;view='market';query='';installedOnly=false;close();render();toast('已创建本页模拟资源；没有执行代码。');
 },true]]);
 $('#custom-type').value=base?.type||category;
 $('#public-skill').value=base?.publicSkill??(base?.id==='analyst'?'literature':'');
 const update=()=>{$('#role-fields').hidden=$('#custom-type').value!=='role'};$('#custom-type').onchange=update;update();
}
function renderSettings(){$('#main').innerHTML=head('设置','通用设置与当前项目设置分离')+'<div class="scroll"><div class="settings-grid"><nav class="settings-nav" aria-label="设置分类"><p class="small quiet">通用设置</p><button>外观（展示）</button><button>AI 连接与账号（展示）</button><button data-view="market">扩展市场 / 已安装</button><button data-view="admin">Nozeli 管理助手</button><p class="small quiet">当前项目</p><button data-view="project">能力与成员</button></nav><section><h2>让管理动作有明确归属</h2><p class="quiet">沿当前设置面板增加入口，不把管理会话放在设置弹窗底部。</p><div class="tile"><h3>Nozeli 管理助手</h3><p>打开独立全局工作面。这里与开始页共用同一会话、草稿及模拟方案。</p><button class="primary" data-view="admin">打开全局管理工作面</button></div><h3 style="margin-top:24px">扩展资源</h3><p>已安装 '+items.filter(i=>i.installed).length+' 项；资源安装与项目绑定分开。</p><button data-view="market">管理已安装资源</button></section></div></div>'}
function renderAdmin(){$('#main').innerHTML=head('Nozeli 全局管理','独立会话 · 非项目 Frontdesk','<button data-view="home">返回工作区</button>')+'<div class="admin-frame"><div class="admin-scope"><strong>应用管理</strong><span class="badge">全局 · 未绑定项目</span><span class="small quiet">无项目内容授权 · 不显示密钥</span></div><div class="conversation" id="conversation"><article class="bubble"><h3>管理 Nozeli，而不是接管项目</h3><p>配置扩展、定制技能／角色、诊断组件，或在明确绑定的开发工作区准备功能候选。</p><div class="actions"><button data-prompt="为我准备视频分析能力">准备视频能力</button><button data-prompt="创建一个研究审阅角色">定制角色</button><button data-prompt="为 Nozeli 开发一个新功能">功能开发</button></div><p class="quiet small">本页回复是本地规则演示，不是模型输出。</p></article>'+messages.map(m=>'<article class="bubble '+(m.user?'user':'')+'"><p>'+escape(m.text)+'</p>'+(m.plan?'<div class="warning">模拟方案 · 尚未执行<br>'+escape(m.plan)+'</div><div class="actions"><button data-plan="'+m.id+'" class="primary" '+(m.done?'disabled':'')+'>'+(m.done?'已模拟确认':'查看变更并确认')+'</button></div>':'')+'</article>').join('')+'</div><form class="composer" id="admin-form"><textarea id="admin-input" aria-label="全局管理输入" placeholder="例如：为项目准备视频分析能力，先让我查看依赖与占用…">'+escape(draft)+'</textarea><footer><span class="quiet small">Demo不执行安装、不操作项目、不修改运行程序</span><button class="primary" type="submit">发送</button></footer></form></div>';$('#admin-input').oninput=e=>draft=e.target.value;$('#admin-form').onsubmit=e=>{e.preventDefault();sendAdmin($('#admin-input').value)}}
function sendAdmin(text){
 text=text.trim();if(!text)return;messages.push({user:true,text});
 let reply,plan;
 if(/开发|功能/.test(text)){reply='功能开发需要明确绑定源码工作区，不能直接覆盖当前安装。此处仅准备操作方案。';plan='绑定开发工作区 → 候选修改与Diff → 构建验证 → 用户明确激活／重启。Demo不绑定真实目录。'}
 else if(/角色|审阅/.test(text)){reply='为研究审阅角色准备独立说明与技能组合；创建模板不会启动Worker。';plan='研究审阅员：角色说明＝核对研究设计与证据；私有技能＝方法审查；公共技能＝文献证据核对@2.1.0。创建本地角色版本后，再由项目显式引入。'}
 else if(/视频|抽帧/.test(text)){reply='准备视频资源方案；安装、全局启用和项目引入分别确认，不会自动派工。';plan='视频引擎（68 MiB示例）＋视频分镜Skill＋视频分析师；引入哪个项目仍需单独确认。'}
 else{reply='此Demo只预设视频能力、角色定制和功能开发三种示例，不理解或执行任意管理请求。请使用上方快捷示例。'}
 messages.push({id:Date.now(),text:reply,plan});draft='';renderAdmin();bind();$('#conversation').scrollTop=$('#conversation').scrollHeight;
}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-install]').forEach(b=>b.onclick=()=>manage(b.dataset.install));document.querySelectorAll('[data-bind]').forEach(b=>b.onclick=()=>bindProject(b.dataset.bind));document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>sendAdmin(b.dataset.prompt));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const m=messages.find(m=>m.id===Number(b.dataset.plan));dialog('确认模拟管理方案','<p>'+escape(m.plan)+'</p><p class="warning">仅记录本页确认；不会安装资源、修改配置、启动Worker或绑定真实项目。</p>',[['取消',close],['确认模拟',()=>{m.done=true;close();renderAdmin();bind();toast('仅记录模拟确认，尚无真实执行。')},true]])});$('#custom')?.addEventListener('click',()=>custom());$('#open-project')?.addEventListener('click',()=>{project=true;view='project';render()})}
$('#project-toggle').onclick=()=>{if(view==='admin')draft=$('#admin-input')?.value??draft;project=!project;view=project?'project':'home';render();toast(project?'已打开合成项目，没有读取真实目录。':'已退出合成项目，绑定保留在本页内存。')};$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#reset').onclick=()=>{if($('#modal').open)close();items=structuredClone(initial);messages=[];members=[];projectSkills=[];projectTargets={};project=false;view='home';category='engine';draft='';query='';installedOnly=false;render();toast('Demo已重置。')};render();
</script></body></html>
