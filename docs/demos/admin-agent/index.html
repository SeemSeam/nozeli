<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nozeli · 独立管理助手 Demo</title><style>
:root{color-scheme:light;--bg:#eff1ed;--paper:#fffefa;--ink:#283a32;--muted:#68756d;--line:#dce3db;--accent:#38654c;--soft:#eaf1e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui}body.dark{color-scheme:dark;--bg:#1b2420;--paper:#242f28;--ink:#e3eae3;--muted:#abb9ad;--line:#415045;--accent:#a5d4af;--soft:#334a39}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 12px;min-height:36px}button:hover{background:var(--soft)}button:disabled{opacity:.55;cursor:default}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.demo{padding:6px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:12px}.demo span{flex:1}.demo button{font-size:12px;padding:2px 9px;min-height:28px}.shell{height:calc(100dvh - 43px);display:grid;grid-template-columns:68px 230px minmax(0,1fr)}nav{padding:16px 8px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:stretch}nav strong{text-align:center;font-size:23px;margin-bottom:14px}nav button{padding:7px 2px;border:0;background:transparent}nav button[aria-current=page]{background:var(--soft);color:var(--accent);font-weight:650}.spacer{flex:1}aside{padding:26px 20px;border-right:1px solid var(--line)}h1,h2,h3,p{margin:0}aside h2{font-size:15px;margin-bottom:18px}aside p{font-size:12px;color:var(--muted);margin:9px 0}aside .card{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.badge{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--muted);font-size:12px}main{min-height:0;display:flex;flex-direction:column;background:var(--paper);margin:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}header h1{font-size:17px}header small{color:var(--muted)}header>div{flex:1}.page{flex:1;min-height:0;display:flex;flex-direction:column}.scope{padding:8px 26px;background:var(--soft);font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.timeline{flex:1;overflow:auto;padding:28px max(24px,calc((100% - 820px)/2));overscroll-behavior:contain}.welcome h2{font-size:24px;margin:12px 0}.welcome p{color:var(--muted);max-width:650px}.examples{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.message{margin:0 0 22px;max-width:820px}.message.user{margin-left:auto;max-width:85%;background:var(--soft);padding:10px 15px;border-radius:10px}.message h3{font-size:12px;color:var(--muted);margin-bottom:6px}.plan{border:1px solid var(--line);border-radius:9px;margin-top:14px;overflow:hidden}.plan>div{padding:13px 16px}.plan .title{background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}.plan ul{margin:0;padding-left:20px}.plan footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}.plan footer span{font-size:12px;color:var(--muted);flex:1}.status{color:var(--accent);font-weight:600}.compose{flex:none;padding:12px max(24px,calc((100% - 820px)/2)) 18px;border-top:1px solid var(--line);background:var(--paper)}textarea{display:block;resize:vertical;width:100%;min-height:70px;max-height:180px;border:1px solid var(--line);border-radius:8px;padding:11px;background:var(--paper)}.compose footer{display:flex;align-items:center;gap:12px;padding-top:8px}.compose small{color:var(--muted);flex:1}.settings{padding:30px;overflow:auto}.settings section{max-width:720px;border-bottom:1px solid var(--line);padding:20px 0}.settings p{color:var(--muted);margin:8px 0}dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#14221b77}dialog .body{padding:24px;overflow:auto}dialog h2{font-size:19px;margin-bottom:10px}dialog p{margin:8px 0}dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line)}.empty{padding:50px 30px}.empty p{color:var(--muted);margin:12px 0}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;z-index:20}body [hidden]{display:none!important}@media(max-width:760px){.shell{grid-template-columns:52px minmax(0,1fr)}aside{display:none}main{margin:5px}header{padding:12px}header small{display:none}.scope{padding:7px 12px;gap:4px 12px}.timeline{padding:20px 14px}.compose{padding:10px 12px}.compose small{font-size:11px}.welcome h2{font-size:21px}.demo{padding:6px 8px}.demo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.settings{padding:16px}.message.user{max-width:94%}header button{padding:6px 9px}}
</style><body><div class="demo"><span>交互原型 · 固定回复／模拟执行 · 不联网、不读项目、不修改安装</span><button id="theme">深浅色</button><button id="reset">重置</button></div><div class="shell"><nav aria-label="应用导航"><strong>N</strong><button data-page="home">开始</button><button data-page="project">项目</button><div class="spacer"></div><button data-page="settings">设置</button></nav><aside><h2>应用工作台</h2><span class="badge">独立管理会话</span><p>与项目 Frontdesk 分离。</p><p>切换入口不切换会话，也不清空草稿。</p><div class="card"><h2>当前范围</h2><p>应用设置与本地诊断</p><p>不继承当前项目正文或对话</p><p>不显示账号密钥</p></div><div class="card"><h2>开发工作区</h2><p id="binding">未绑定</p><button id="bind-side">选择演示工作区</button></div><div class="card"><p>资源商店、扩展库与在线下载本期不提供。</p></div></aside><main id="main"></main></div><dialog id="confirm"><div class="body"><h2 id="confirm-title"></h2><div id="confirm-content"></div></div><footer><button id="cancel">取消</button><button id="accept" class="primary">确认模拟执行</button></footer></dialog><div id="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={page:'home',draft:'',messages:[],bound:false,revision:1,appearance:'跟随系统',connected:false,models:{admin:'',frontdesk:'',orchestrator:'',worker:''}},pending=null,timer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,2800)}
function saveDraft(){if($('#admin-input'))state.draft=$('#admin-input').value}function go(page){saveDraft();state.page=page;render()}
function modal(title,html,run,label='确认模拟执行'){pending=run;$('#confirm-title').textContent=title;$('#confirm-content').innerHTML=html;$('#accept').textContent=label;$('#confirm').showModal();$('#cancel').focus()}
function bind(){saveDraft();modal('绑定功能开发工作区','<p>演示工作区：<strong>Nozeli 开发副本（合成）</strong></p><p>只将后续功能候选指向这一工作区；不代表读取全部项目，也不允许覆盖正在运行的安装。</p><p>Demo没有文件选择或实际目录访问。</p>',()=>{state.bound=true;render();toast('已模拟绑定开发副本；未访问磁盘')},'绑定演示工作区')}
const demoSources={official:['通用助手（示例）','推理模型（示例）'],custom:['自定义模型 A（示例）','自定义模型 B（示例）']};
function settingsSection(id){go('settings');document.getElementById(id)?.scrollIntoView({block:'start'});}
function connect(method){saveDraft();modal(method==='api'?'设置 API · 模拟':'登录账号 · 模拟','<p>本Demo不接收真实API Key、不打开授权网站、不存储凭据。</p><p>确认只登记一个示例连接，随后可选择管理员默认模型，再回原会话。</p>',()=>{state.connected=true;settingsSection('settings-models');toast('仅模拟连接完成，请选择管理员模型')},'完成模拟连接');}
function modelSettings(){return '<form id="model-form">'+Object.entries({admin:'管理员 Agent',frontdesk:'前台',orchestrator:'主控',worker:'工作助手'}).map(([role,label])=>{const selected=state.models[role],source=selected?selected.split('/')[0]:'official';return '<fieldset style="margin:12px 0;border:1px solid var(--line);border-radius:8px"><legend>'+label+'</legend><label>模型源 <select data-source="'+role+'" '+(!state.connected?'disabled':'')+'><option value="official" '+(source==='official'?'selected':'')+'>示例内置源</option><option value="custom" '+(source==='custom'?'selected':'')+'>示例自定义源</option></select></label> <label>模型 <select data-model="'+role+'" '+(!state.connected?'disabled':'')+'>'+modelOptions(source,selected)+'</select></label></fieldset>';}).join('')+'<p id="model-status" role="status">'+(state.connected?'选择后保存才生效。':'请先设置 API／登录；当前不能保存模型。')+'</p><button type="submit" '+(!state.connected?'disabled':'')+'>保存默认模型（模拟）</button></form>';}
function modelOptions(source,selected){return '<option value="">未选择</option>'+demoSources[source].map((name,index)=>{const value=source+'/'+index;return '<option value="'+value+'" '+(value===selected?'selected':'')+'>'+name+'</option>';}).join('');}
function bindModels(){document.querySelectorAll('[data-source]').forEach(source=>source.onchange=()=>{const model=document.querySelector('[data-model="'+source.dataset.source+'"]');model.innerHTML=modelOptions(source.value,'');$('#model-status').textContent='正在浏览此源；尚未保存，原默认模型保持不变。';});$('#model-form').onsubmit=event=>{event.preventDefault();if(!state.connected)return;const next={...state.models};for(const select of document.querySelectorAll('[data-model]')){const role=select.dataset.model;if(select.value)next[role]=select.value;else if(document.querySelector('[data-source="'+role+'"]').value===(state.models[role]?.split('/')[0]||'official'))next[role]='';}state.models=next;$('#model-status').textContent='默认模型已模拟保存；管理员选择独立于其他角色。';toast('模型已保留；返回原管理员会话继续');};}
function plan(type){return type==='settings'?{type,title:'外观设置变更',lines:['范围：仅应用外观，不涉及项目内容','变更：跟随系统 → 深色；保留字号与阅读位置','生效：确认后更新本页模拟设置，可回退'],base:state.revision,status:'pending'}:{type,title:'功能开发候选',lines:['范围：Nozeli 开发副本（合成），不写入当前安装','准备：独立候选、差异与针对性验证','交付：先看候选；安装与重启是另一项明确操作'],status:'pending'}}
function send(text){saveDraft();text=text.trim();if(!text)return;state.messages.push({user:true,text});state.draft='';let message;
if(/安装|商店|市场|技能|资源库/.test(text))message={text:'本期只演示独立管理助手。资源商店、技能安装和在线下载暂不提供；不会将请求伪装成已经安装。'};
else if(/诊断|检查|更新|故障/.test(text))message={text:'下面是合成诊断结果，不是对这台电脑的扫描。查看诊断不需要执行确认，也不会自动派修复任务。',diagnostic:true};
else if(/深色|外观|设置/.test(text))message={text:'已准备具体设置变更。请查看作用域和差异；确认只改变本页模拟配置。',plan:plan('settings')};
else if(/功能|开发|修复|源码/.test(text))message=state.bound?{text:'在已绑定开发副本准备候选，不直接改写运行程序。此演示不会创建真实 Worker 或调用模型。',plan:plan('development')}:{text:'功能开发需要先选择源码工作区，不能把当前论文项目或运行安装作为默认目标。',needsBinding:true};
else message={text:'此Demo只预设应用诊断、外观设置和功能开发三类请求，不具备通用模型理解。可使用上方示例继续。'};
state.messages.push(message);render();$('.timeline').scrollTop=$('.timeline').scrollHeight}
function viewPlan(m,i){const p=m.plan,status={pending:'待确认',completed:'已模拟完成',candidate:'候选已模拟准备 · 未安装',reverted:'已模拟回退',cancelled:'已取消',stale:'设置已变化，需重建方案'}[p.status];return '<section class="plan"><div class="title">'+esc(p.title)+'<span class="badge">'+status+'</span></div><div><ul>'+p.lines.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul></div><footer><span>本页内存模拟 · 无宿主执行回执</span>'+(p.status==='pending'?'<button data-drop="'+i+'">取消方案</button><button class="primary" data-review="'+i+'">查看变更</button>':p.status==='completed'?'<button data-revert="'+i+'">回退本次设置</button>':p.status==='candidate'?'<button data-candidate="'+i+'">查看候选结果</button>':'')+'</footer></section>'}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false'));$('#binding').textContent=state.bound?'Nozeli 开发副本 · 合成':'未绑定';const main=$('#main');
if(state.page==='admin'){main.innerHTML='<header><div><h1>Nozeli 管理员 Agent</h1><small>管理应用，不接管项目</small></div><span class="badge">独立会话</span><button id="workspace">开发工作区</button></header><div class="page"><div class="scope"><strong>应用管理</strong><span>项目内容：未授权</span><span>系统提权：未授予</span></div><div class="timeline" role="log" aria-label="管理对话"><section class="welcome"><h2>让 Nozeli 更适合你的工作。</h2><p>检查应用状态、调整设置，或在明确的开发副本中准备功能候选。与项目讨论分开，保留同一份管理会话。</p><div class="plan"><div class="title">'+(state.connected?'连接已模拟配置':'开始前，先设置 API／登录')+'</div><div><p>'+(state.connected?'当前管理员模型：'+esc(state.models.admin||'未选择；前往默认模型设置'):'先配置模型服务，再为管理员 Agent 选择默认模型。Demo不收集真实密钥。')+'</p><div class="examples"><button data-connect>先设置 API／登录</button><button data-models>管理员模型设置</button></div></div></div><div class="examples"><button data-prompt="检查应用状态">检查应用状态</button><button data-prompt="将应用外观改为深色">调整外观设置</button><button data-prompt="为 Nozeli 开发新功能">准备功能开发</button></div></section>'+state.messages.map((m,i)=>'<article class="message '+(m.user?'user':'')+'"><h3>'+(m.user?'你':'管理助手 · 固定回复')+'</h3><p>'+esc(m.text)+'</p>'+(m.diagnostic?'<section class="plan"><div class="title">应用诊断 · 示例数据</div><div><p>应用：Nozeli 示例版本</p><p>设置：'+esc(state.appearance)+'</p><p>开发副本：'+(state.bound?'已模拟绑定':'未绑定')+'</p><p>安装故障：未进行真实检查</p><details><summary>诊断边界</summary>没有扫描文件、读取密钥、检查网络或启动模型。</details></div></section>':'')+(m.needsBinding?'<div class="examples"><button data-bind>选择开发工作区</button></div>':'')+(m.plan?viewPlan(m,i):'')+'</article>').join('')+'</div><form class="compose" id="compose"><textarea id="admin-input" aria-label="管理助手输入" placeholder="描述你希望检查或调整的应用行为…">'+esc(state.draft)+'</textarea><footer><small>本地演示 · 不调用模型或执行真实操作</small><button class="primary" type="submit">发送</button></footer></form></div>';$('#workspace').onclick=bind;$('#admin-input').oninput=e=>state.draft=e.target.value;$('#compose').onsubmit=e=>{e.preventDefault();send($('#admin-input').value)};$('#admin-input').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.isComposing){e.preventDefault();send(e.target.value)}};
}else if(state.page==='settings'){main.innerHTML='<header><div><h1>设置</h1><small>应用配置 · 全部为页内模拟</small></div></header><div class="settings"><section id="settings-admin"><h2>管理员 Agent</h2><p>独立管理 Nozeli；与空白项目主页共用同一管理会话和草稿。</p><button data-enter>打开管理员 Agent</button></section><section id="settings-connection"><h2>API／登录</h2><p>'+esc(state.connected?'已完成模拟连接；没有真实账号或密钥':'尚未配置；请选择一种演示连接方式。')+'</p><div class="examples"><button data-api>设置 API（模拟）</button><button data-login>登录账号（模拟）</button><button data-enter>返回管理员会话</button></div></section><section id="settings-models"><h2>默认模型</h2><p>先选源，再选模型。管理员 Agent 单独配置，不改变项目三角色；模型清单均为示例，不证明服务端可用。</p>'+modelSettings()+'</section><section><h2>应用外观</h2><p>当前模拟设置：'+esc(state.appearance)+'</p></section></div>';bindModels();}
else if(state.page==='project'){main.innerHTML='<header><div><h1>空白项目主页</h1><small>尚未打开文件</small></div></header><div class="empty"><h2>从这里开始工作</h2><p>可以先与管理员 Agent 配置应用；不会把这个空白项目绑定为开发工作区。</p><button class="primary" data-enter>从管理员 Agent 开始</button></div>'}
else{main.innerHTML='<header><div><h1>空白项目主页</h1><small>未打开项目或文件</small></div></header><div class="empty"><h2>你想从哪里开始？</h2><p>管理员 Agent 可帮助配置应用、检查状态和准备功能候选，无须先打开论文或项目。</p><button class="primary" data-enter>从管理员 Agent 开始</button></div>'}
main.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>go('admin'));main.querySelectorAll('[data-bind]').forEach(b=>b.onclick=bind);main.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>send(b.dataset.prompt));main.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{saveDraft();state.messages[+b.dataset.drop].plan.status='cancelled';render()});main.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>review(+b.dataset.review));main.querySelectorAll('[data-revert]').forEach(b=>b.onclick=()=>{saveDraft();const p=state.messages[+b.dataset.revert].plan;if(p.appliedRevision!==state.revision){toast('设置在之后已变化，不覆盖新值');return}state.appearance=p.previous;state.revision++;p.status='reverted';render();toast('本页模拟设置已回退')});main.querySelectorAll('[data-candidate]').forEach(b=>b.onclick=()=>modal('功能候选 · 示例结果','<p>候选修改：1个示例界面文件。</p><p>验证状态：未真实构建、测试或运行。</p><p><strong>未安装、未重启、未覆盖运行程序。</strong></p>',()=>{},'知道了'));
main.querySelectorAll('[data-connect]').forEach(b=>b.onclick=()=>settingsSection('settings-connection'));main.querySelectorAll('[data-models]').forEach(b=>b.onclick=()=>settingsSection('settings-models'));main.querySelectorAll('[data-api]').forEach(b=>b.onclick=()=>connect('api'));main.querySelectorAll('[data-login]').forEach(b=>b.onclick=()=>connect('login'));
}
function review(i){saveDraft();const p=state.messages[i].plan;modal('查看具体变更',p.lines.map(s=>'<p>'+esc(s)+'</p>').join('')+'<p class="badge">只记录模拟执行，不代表真实变更</p>',()=>{if(p.type==='settings'){if(p.base!==state.revision){p.status='stale';render();toast('模拟设置版本已变化，原方案未执行');return}p.previous=state.appearance;state.appearance='深色';state.revision++;p.appliedRevision=state.revision;p.status='completed'}else{if(!state.bound){toast('开发工作区未绑定，未执行');return}p.status='candidate'}render();toast('模拟完成；真实配置与安装未改变')})}
$('#cancel').onclick=()=>{$('#confirm').close();pending=null};$('#confirm').addEventListener('cancel',()=>pending=null);$('#accept').onclick=()=>{const run=pending;pending=null;$('#confirm').close();run?.()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#bind-side').onclick=bind;$('#theme').onclick=()=>document.body.classList.toggle('dark');$('#reset').onclick=()=>{if($('#confirm').open)$('#confirm').close();pending=null;state={page:'home',draft:'',messages:[],bound:false,revision:1,appearance:'跟随系统',connected:false,models:{admin:'',frontdesk:'',orchestrator:'',worker:''}};render();toast('演示已重置')};render();
</script></body></html>
